services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pnpps
      POSTGRES_USER: pnpps
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pnpps_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pnpps_redisdata:/data
volumes:
  pnpps_pgdata:
  pnpps_redisdata:
